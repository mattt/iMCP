name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

permissions:
    contents: read
    pull-requests: write

jobs:
    build:
        name: Build on macOS ${{ matrix.macos }} with Xcode ${{ matrix.xcode }}
        runs-on: ${{ matrix.runner }}
        env:
            DEVELOPER_DIR: "/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer"
        strategy:
            fail-fast: false
            matrix:
                include:
                    - macos: "26"
                      xcode: "26.0"
                      runner: macos-26
                    - macos: "27"
                      xcode: "27.0"
                      runner: xcode-27
        # Runner images without the iOS platform download it before building the iOS app.
        timeout-minutes: 30
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            # Key the cache on the exact Xcode build,
            # so a runner image update can't restore module files
            # compiled against an older toolchain.
            - name: Read Xcode build number
              id: xcode
              run: echo "build=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "${GITHUB_OUTPUT}"

            - name: Cache Xcode build artifacts
              uses: actions/cache@v5
              with:
                  path: |
                      ~/Library/Developer/Xcode/DerivedData
                      !~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
                      ~/Library/Caches/org.swift.swiftpm
                  key: ${{ runner.os }}-xcode-${{ steps.xcode.outputs.build }}-derived-${{ hashFiles('**/Package.resolved') }}
                  restore-keys: |
                      ${{ runner.os }}-xcode-${{ steps.xcode.outputs.build }}-derived-

            - name: Lint
              run: swift format lint --strict --recursive .

            - name: Build
              run: |
                  xcodebuild -quiet \
                      -scheme iMCP \
                      -configuration Debug \
                      -destination "platform=macOS" \
                      CODE_SIGNING_ALLOWED=NO \
                      CODE_SIGNING_REQUIRED=NO \
                      HELPER_CODE_SIGNING_ALLOWED=NO \
                      build

            # Some runner images include Xcode without its iOS platform,
            # which the iOS app needs even for an unsigned build.
            - name: Install the iOS platform if it's missing
              run: |
                  if xcodebuild -showdestinations -scheme "iMCP iOS" 2>&1 | grep -q "is not installed"; then
                      xcodebuild -downloadPlatform iOS
                  fi

            # The iOS app's entitlements need a provisioning profile,
            # so CI checks that it compiles and packages without signing.
            - name: Build iMCP iOS
              run: |
                  xcodebuild -quiet \
                      -scheme "iMCP iOS" \
                      -configuration Debug \
                      -destination "generic/platform=iOS" \
                      CODE_SIGNING_ALLOWED=NO \
                      CODE_SIGNING_REQUIRED=NO \
                      build

            # The cache action's exclude pattern has not kept the module cache out of
            # the archive, and runner images with the same Xcode build can differ in
            # toolchain file timestamps, which makes a restored module cache fatal.
            # Remove it before the cache is saved at the end of the job.
            - name: Drop the module cache before saving
              if: always()
              run: rm -rf ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
