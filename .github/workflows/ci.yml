name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

permissions:
    contents: read
    pull-requests: write

jobs:
    build:
        name: Build on macOS ${{ matrix.macos }} with Xcode ${{ matrix.xcode }}
        runs-on: ${{ matrix.runner }}
        env:
            DEVELOPER_DIR: "/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer"
        strategy:
            fail-fast: false
            matrix:
                include:
                    - macos: "26"
                      xcode: "26.0"
                      runner: macos-26
                    - macos: "27"
                      xcode: "27.0"
                      runner: xcode-27
        timeout-minutes: 10
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            # Key the cache on the exact Xcode build,
            # so a runner image update can't restore module files
            # compiled against an older toolchain.
            - name: Read Xcode build number
              id: xcode
              run: echo "build=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "${GITHUB_OUTPUT}"

            - name: Cache Xcode build artifacts
              uses: actions/cache@v5
              with:
                  path: |
                      ~/Library/Developer/Xcode/DerivedData
                      !~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
                      ~/Library/Caches/org.swift.swiftpm
                  # Bump the version when a saved cache is known to be bad.
                  # v2: Xcode 26.0 and 26.0.1 share build 17A400, so the archives saved
                  # with the Helper's module cache inside still match the old key.
                  key: ${{ runner.os }}-xcode-${{ steps.xcode.outputs.build }}-derived-v2-${{ hashFiles('**/Package.resolved') }}
                  restore-keys: |
                      ${{ runner.os }}-xcode-${{ steps.xcode.outputs.build }}-derived-v2-

            - name: Lint
              run: swift format lint --strict --recursive .

            - name: Build
              run: |
                  xcodebuild -quiet \
                      -scheme iMCP \
                      -configuration Debug \
                      -destination "platform=macOS" \
                      CODE_SIGNING_ALLOWED=NO \
                      CODE_SIGNING_REQUIRED=NO \
                      HELPER_CODE_SIGNING_ALLOWED=NO \
                      build

            - name: Test
              run: |
                  xcodebuild -quiet \
                      -scheme imcp-serverTests \
                      -destination "platform=macOS" \
                      CODE_SIGNING_ALLOWED=NO \
                      CODE_SIGNING_REQUIRED=NO \
                      test

            # The cache action's exclude pattern has not kept the module cache out of
            # the archive, and runner images with the same Xcode build can differ in
            # toolchain file timestamps, which makes a restored module cache fatal.
            # The Helper target keeps a second module cache under
            # DerivedData/.../HelperDerivedData, so remove every module cache under
            # DerivedData before the job saves the cache.
            - name: Drop the module cache before saving
              if: always()
              run: |
                  find ~/Library/Developer/Xcode/DerivedData \
                      -type d -name "ModuleCache.noindex" -prune -exec rm -rf {} +
